<div class="reset-wrapper">
  <div class="reset-card">
    <h2 class="reset-title">Reset Password</h2>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="rp-username">Email / Username</label>
        <input
          id="rp-username"
          type="email"
          formControlName="username"
          placeholder="Enter your registered email"
        />
        <div class="field-error" *ngIf="username?.invalid && (username?.dirty || username?.touched)">
          Please enter a valid email address.
        </div>
      </div>

      <button
        type="button"
        class="secondary-btn"
        (click)="sendOtp()"
        [disabled]="isSendingOtp || username?.invalid"
      >
        {{ isSendingOtp ? 'Sending OTP…' : otpSent ? 'Resend OTP' : 'Send OTP' }}
      </button>

      <ng-container *ngIf="otpSent">
        <div class="form-field">
          <label for="rp-otp">OTP</label>
          <input
            id="rp-otp"
            type="text"
            maxlength="6"
            formControlName="otpStr"
            placeholder="Enter 6-digit OTP"
          />
          <div class="field-error" *ngIf="otpStr?.invalid && (otpStr?.dirty || otpStr?.touched)">
            Enter the 6-digit OTP you received.
          </div>
        </div>

        <div class="form-field">
          <label for="rp-new-password">New Password</label>
          <input
            id="rp-new-password"
            type="password"
            formControlName="newPassword"
            placeholder="Enter new password"
          />
          <div class="field-error" *ngIf="newPassword?.invalid && (newPassword?.dirty || newPassword?.touched)">
            Password must be at least 6 characters.
          </div>
        </div>

        <div class="form-field">
          <label for="rp-confirm-password">Confirm Password</label>
          <input
            id="rp-confirm-password"
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm new password"
          />
          <div class="field-error" *ngIf="resetForm.hasError('passwordMismatch') && (confirmPassword?.dirty || confirmPassword?.touched)">
            Passwords do not match.
          </div>
        </div>

        <button
          type="submit"
          class="primary-btn"
          [disabled]="resetForm.invalid || isSubmitting"
        >
          {{ isSubmitting ? 'Resetting…' : 'Reset Password' }}
        </button>
      </ng-container>
    </form>

    <div
      class="message"
      *ngIf="message"
      [ngClass]="{
        success: messageType === 'success',
        error: messageType === 'error',
        info: messageType === 'info'
      }"
    >
      {{ message }}
    </div>
  </div>
</div>

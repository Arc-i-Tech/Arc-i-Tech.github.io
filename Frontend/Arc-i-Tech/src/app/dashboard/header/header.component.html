<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3 shadow-sm">
  <a class="navbar-brand fw-bold" href="#">{{ DashboardName }}</a>

  <div class="d-flex align-items-center ms-auto">

    <!-- Notification Bell (Always visible) -->
    <div class="me-3 position-relative dropdown">
      <button
        class="btn btn-light position-relative"
        id="notificationDropdown"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <i
          class="bi bi-bell-fill fs-5"
          [ngClass]="notificationCount > 0 ? 'text-danger' : 'text-primary'"
        ></i>
        <span
          *ngIf="notificationCount > 0"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
        >
          {{ notificationCount }}
        </span>
      </button>

      <ul
        class="dropdown-menu dropdown-menu-end mt-2 animate__animated animate__fadeIn"
        aria-labelledby="notificationDropdown"
        style="min-width: 300px;"
      >
        <li class="dropdown-header fw-bold text-dark">Notifications</li>
        <li *ngIf="notifications.length === 0" class="dropdown-item text-muted">
          No new notifications
        </li>
        <li *ngFor="let notify of notifications">
          <a class="dropdown-item small" href="#">
            <i class="bi bi-info-circle text-primary me-2"></i>{{ notify.message }}
          </a>
        </li>
      </ul>
    </div>

    <!-- Static Profile Dropdown -->
    <div class="dropdown">
      <button
        class="btn btn-light dropdown-toggle d-flex align-items-center"
        type="button"
        id="profileDropdown"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <i class="bi bi-person-circle me-2"></i>
        {{ loggedInUser?.email || 'User' }}
      </button>

      <ul
        class="dropdown-menu dropdown-menu-end mt-2 animate__animated animate__fadeIn"
        aria-labelledby="profileDropdown"
      >
        <li>
                    <a class="dropdown-item">

          <!-- <a class="dropdown-item" [routerLink]="['/user/profile']"> -->
            <i class="bi bi-person me-2"></i> Profile
          </a>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button class="dropdown-item text-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </button>
        </li>
      </ul>
    </div>

  </div>
</nav>

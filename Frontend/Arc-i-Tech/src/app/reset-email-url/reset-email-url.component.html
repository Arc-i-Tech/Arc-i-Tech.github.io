<div class="theme-bg-light-primary" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="theme-bg-quaternary theme-border-tertiary" style="width: 100%; max-width: 400px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">

    <h2 class="theme-text-primary" style="text-align: center; font-size: 24px; font-weight: 600; margin-bottom: 20px;">
      Reset Password
    </h2>

    <form (ngSubmit)="onSubmit()" [formGroup]="resetForm" novalidate>

      <div style="margin-bottom: 15px;">
        <label for="email" class="theme-text-secondary" style="display: block; font-size: 14px; margin-bottom: 5px;">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="theme-border-secondary"
          style="width: 100%; padding: 10px; border: 1px solid; border-radius: 6px; outline: none;"
          placeholder="Enter your email"
        />
       <div *ngIf="message" [ngClass]="messageType === 'success' ? 'success-message' : 'error-message'" style="text-align: center; margin-bottom: 10px;">
  {{ message }}
</div>

      </div>

      <button
        type="submit"
        [disabled]="resetForm.invalid"
        class="theme-bg-secondary theme-text-quaternary"
        style="width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
        Send Reset Link
      </button>
    </form>

    <div style="text-align: center; margin-top: 15px;">
      <a routerLink="/login" class="theme-a-light">Back to Login</a>
    </div>

  </div>
</div>
